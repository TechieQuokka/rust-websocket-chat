<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Test Client</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        input { margin: 5px; padding: 8px; }
        button { margin: 5px; padding: 8px 15px; }
        #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin: 10px 0; }
        .message { margin: 5px 0; }
        .system { color: #666; font-style: italic; }
    </style>
</head>
<body>
    <h1>🦀 Rust Chat Test Client</h1>
    
    <div id="status" class="status disconnected">Disconnected</div>
    
    <div>
        <input id="username" placeholder="Username" value="TestUser">
        <input id="room" placeholder="Room" value="test">
        <button onclick="join()">Join</button>
        <button onclick="leave()">Leave</button>
    </div>
    
    <div id="messages"></div>
    
    <div>
        <input id="messageInput" placeholder="Type message..." style="width: 300px;">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        let ws = null;
        let connected = false;

        function connect() {
            ws = new WebSocket('ws://localhost:8080/ws');
            
            ws.onopen = () => {
                connected = true;
                updateStatus('Connected', true);
                addMessage('System: Connected to server', true);
            };
            
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                addMessage(`Received: ${msg.type} - ${JSON.stringify(msg.data)}`, true);
            };
            
            ws.onclose = () => {
                connected = false;
                updateStatus('Disconnected', false);
                addMessage('System: Disconnected from server', true);
                setTimeout(connect, 2000);
            };
            
            ws.onerror = (error) => {
                addMessage(`Error: ${error}`, true);
            };
        }

        function updateStatus(text, isConnected) {
            const status = document.getElementById('status');
            status.textContent = text;
            status.className = `status ${isConnected ? 'connected' : 'disconnected'}`;
        }

        function addMessage(text, isSystem = false) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${isSystem ? 'system' : ''}`;
            div.textContent = `${new Date().toLocaleTimeString()}: ${text}`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function join() {
            if (!connected) return;
            const username = document.getElementById('username').value;
            const room = document.getElementById('room').value;
            
            const msg = {
                type: 'Join',
                data: { room, username }
            };
            
            ws.send(JSON.stringify(msg));
            addMessage(`Sent: Join room '${room}' as '${username}'`);
        }

        function leave() {
            if (!connected) return;
            const room = document.getElementById('room').value;
            
            const msg = {
                type: 'Leave',
                data: { room }
            };
            
            ws.send(JSON.stringify(msg));
            addMessage(`Sent: Leave room '${room}'`);
        }

        function sendMessage() {
            if (!connected) return;
            const room = document.getElementById('room').value;
            const message = document.getElementById('messageInput').value;
            
            if (!message.trim()) return;
            
            const msg = {
                type: 'SendMessage',
                data: { room, message }
            };
            
            ws.send(JSON.stringify(msg));
            addMessage(`Sent message: ${message}`);
            document.getElementById('messageInput').value = '';
        }

        // Event listeners
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Connect on load
        connect();
    </script>
</body>
</html>
